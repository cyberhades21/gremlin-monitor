[project]
name = "gremlin-assess"
version = "0.1.0"
description = "Internal tooling for the assessment pilot: package checks, grading and validation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
gassess = "gremlin_assess.cli:main"

[project.optional-dependencies]
model = [
    "anthropic>=2.10.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gremlin_assess", "src/workspace_tools"]

[tool.pytest.ini_options]
testpaths = ["tests", "spikes"]
# The fixture packages contain their own test files. They are run by the
# grading harness, never collected by this project's test run.
norecursedirs = ["fixtures", ".venv"]
markers = ["docker: runs real containers and needs Docker running"]
