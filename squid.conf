# The editor's only way out. It has no direct route to the internet; it reaches the outside
# through this proxy, and the proxy only lets through the sites in allowed-domains.txt
# (built at start from egress-allowlist.txt plus the host the project is cloned from).

http_port 3128

# No cache and no record of what anyone looks up. The consent page says what is recorded,
# and this is not part of it.
cache deny all
access_log none
cache_store_log none

via off
forwarded_for delete
shutdown_lifetime 1 seconds

acl allowed dstdomain "/etc/squid/allowed-domains.txt"
acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
