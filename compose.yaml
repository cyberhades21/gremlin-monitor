services:
  # Receives the editor's activity events (file, line and save) and keeps them for the report.
  wakapi:
    image: ghcr.io/muety/wakapi:2.18.2
    init: true
    environment:
      # Must stay the same between runs. Set your own in .env; this default is only for local use.
      WAKAPI_PASSWORD_SALT: ${WAKAPI_PASSWORD_SALT:-local-dev-salt-change-me}
    volumes:
      - wakapi-data:/data
    ports:
      - "127.0.0.1:${WAKAPI_PORT:-3001}:3000"

  # Runs once: waits for Wakapi, makes its user and saves the API key in the shared volume.
  # (The Wakapi image has no shell, so it cannot have a healthcheck of its own.)
  wakapi-setup:
    image: curlimages/curl:8.11.1
    user: root  # the shared volume is owned by root
    entrypoint: ["sh", "/setup.sh"]
    depends_on:
      - wakapi
    volumes:
      - ./wakapi-setup.sh:/setup.sh:ro
      - monitor:/shared
    restart: "no"

  editor:
    build: .
    image: gremlin-editor
    # Each editor shows up in Wakapi under this machine name, so sessions can be told apart.
    hostname: ${SESSION_ID:-editor}
    depends_on:
      wakapi-setup:
        condition: service_completed_successfully
    ports:
      # Loopback only. Change the left side when the link must reach another machine.
      - "127.0.0.1:${PORT:-8181}:8080"
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/fastapi/full-stack-fastapi-template}
      REPO_REF: ${REPO_REF:-}
      PASSWORD: ${PASSWORD:-}
      WAKAPI_URL: http://wakapi:3000/api
    volumes:
      - monitor:/shared:ro

volumes:
  wakapi-data:
  monitor:
